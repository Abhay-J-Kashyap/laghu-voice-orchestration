backend:
  provider: mock

tools:
  book_session:
    mock:
    - if:
        program: full_time
        intake: july
      outcome: ok
      data: {}
    - if:
        program: executive
        intake: july
      outcome: ok
      data: {}
    - if:
        program: online
        intake: july
      outcome: ok
      data: {}
    - if:
        program: online
        intake: january
      outcome: ok
      data: {}
    - outcome: ok
    save:
      booking: data
    events:
    - if:
        outcome: ok
      then: confirm_booking
    - then: error
    commits: true

states:
  greet:
    expect: yes_no
    say: greeting
    also:
    - name
    'on':
      'yes': ask_program
      'no': goodbye_decline
  ask_program:
    expect: program
    say: ask_program
    'on':
      answer: ask_intake
    skip_if: program
  ask_intake:
    expect: intake
    say: ask_intake
    'on':
      answer: ask_experience
    skip_if: intake
  ask_experience:
    expect: experience
    say: ask_experience
    'on':
      answer: ask_city
    skip_if: experience
  ask_city:
    expect: city
    say: ask_city
    'on':
      answer: offer_counselling
    skip_if: city
  offer_counselling:
    say: offer_counselling
    next: ask_session_day
  ask_session_day:
    expect: session_day
    say: ask_session_day
    'on':
      answer: ask_session_time
    skip_if: session_day
  ask_session_time:
    expect: session_time
    say: ask_session_time
    'on':
      answer: confirm
    skip_if: session_time
  confirm:
    say: readback
    expect: yes_no
    corrections:
    - program
    - intake
    - experience
    - city
    - session_day
    - session_time
    'on':
      'yes': book_session
      'no': fix
  fix:
    say: fix_prompt
    expect: yes_no
    corrections:
    - program
    - intake
    - experience
    - city
    - session_day
    - session_time
    'on':
      'yes': confirm
      'no': goodbye_decline
      corrected: confirm
  book_session:
    tool: book_session
    'on':
      confirm_booking: booking_success
      error: tech_problem
  booking_success:
    say: booking_success
    end: booked
    outcome: success
  goodbye_decline:
    say: goodbye
    end: declined
    outcome: declined
  scholarship_help:
    say: scholarship_line
    next: handover
  discount_help:
    say: discount_line
    next: handover
  admission_help:
    say: admission_line
    next: handover
  human_help:
    say: human_line
    next: handover
  callback_flow:
    say: callback_offer
    expect: yes_no
    'on':
      'yes': ask_callback_date
      'no': goodbye_decline
  ask_callback_date:
    expect: callback_date
    say: ask_callback_date
    'on':
      answer: ask_callback_time
  ask_callback_time:
    expect: callback_time
    say: ask_callback_time
    'on':
      answer: callback_confirm
  callback_confirm:
    say: callback_confirm
    end: callback_scheduled
    outcome: success

global:
  scholarship: scholarship_help
  discount: discount_help
  admission_guarantee: admission_help
  human: human_help
  callback: callback_flow
