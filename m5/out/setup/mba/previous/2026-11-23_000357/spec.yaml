    commits: true

states:
  greet:
    expect: yes_no
    say: greeting
    also:
    - name
    'on':
      'yes': ask_program
      'no': goodbye_decline
  goodbye_decline:
    say: goodbye
    end: declined
    outcome: declined
  ask_program:
    expect: program
    say: ask_program
    'on':
      answer: program_chosen
    skip_if: program
  program_chosen:
    next: ask_intake
  ask_intake:
    expect: intake
    say: ask_intake
    'on':
      answer: intake_chosen
    skip_if: intake
    corrections:
    - intake
  intake_chosen:
    next: ask_experience
  ask_experience:
    expect: experience
    say: ask_experience
    'on':
      answer: experience_given
    skip_if: experience
  experience_given:
    next: ask_city
  ask_city:
    expect: city
    say: ask_city
    'on':
      answer: city_given
    skip_if: city
  city_given:
    next: offer_counselling
  offer_counselling:
    expect: yes_no
    say: offer_counselling
    'on':
      'yes': choose_appointment
      'no': offer_callback
  choose_appointment:
    expect: appointment
    say: choose_appointment
    'on':
      answer: appointment_set
    skip_if: appointment
  appointment_set:
    next: confirm_booking
  offer_callback:
    expect: yes_no
    say: offer_callback
    'on':
      'yes': ask_callback_time
      'no': goodbye_no_booking
  ask_callback_time:
    expect: callback_time
    say: ask_callback_time
    'on':
      answer: callback_time_set
    skip_if: callback_time
  callback_time_set:
    next: goodbye_callback_scheduled
  confirm_booking:
    expect: yes_no
    say: readback_booking
    corrections:
    - program
    - intake
    - appointment
    'on':
      'yes': book_session
      'no': fix_booking
      corrected: confirm_booking
  fix_booking:
    say: fix_prompt
    expect: yes_no
    corrections:
    - program
    - intake
    - appointment
    'on':
      'yes': confirm_booking
      'no': goodbye_no_booking
      corrected: confirm_booking
  book_session:
    tool: book_session
    'on':
      booked: booking_success
      error: tech_problem
  booking_success:
    say: booking_done
