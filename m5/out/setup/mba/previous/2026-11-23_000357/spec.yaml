    - if:
        program: executive
      outcome: ok
      data:
        session_id: EX456
    - if:
        program: online
      outcome: ok
      data:
        session_id: ON789
    - outcome: ok
    save:
      session_id: data.session_id
    events:
    - if:
        outcome: ok
      then: booked
