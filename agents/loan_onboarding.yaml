# Loan onboarding (Milestone 4). One use case for the engine in laghu_voice/dialog/; nothing below is in its code.
#
# The backend (the Voice Onboarding Agent service) owns everything that must be true: the steps allowed next,
# the credit decision, attempt limits, the audit trail. This file owns the conversation.
#
# Lines come in three kinds:
#   "text"                         said exactly. With no {values} it is synthesised once at startup (fixed);
#                                  with {values} it is filled in during the call (template).
#   {llm: goal, example: "text"}   written by the LLM each time from the goal (English), in the example's style.
#                                  The example is said instead if the LLM fails a check or doesn't answer.
# Fixed and template lines are the regulated ones (disclosures, read-backs of private details, the offer's
# numbers, consent, refusals, hand-overs); everything conversational is written by the LLM.
#
# Every Hindi line has its English meaning in the comment beside it. The loader (spec.py) refuses a spec with
# a line starting with नमस्ते (Laghu mispronounces it), English letters (Laghu drops them), a feminine first
# person for a male agent, an LLM line using a private value, or a missing target.

agent:
  name: लघु                       # Laghu
  company: मेरिडियन फ़ाइनेंस          # Meridian Finance (the backend's lender). Change it here.
  company_en: Meridian Finance
  gender: male
  persona: >-
    The agent, Laghu, is a male agent from Meridian Finance taking a caller through a personal loan
    application by phone: verifying their identity, taking the loan details, giving the decision and
    recording consent. Polite, warm, brief, plain Hindi that a caller can follow on the phone.

knowledge:                         # what the LLM may use to answer questions; numbers here may be said
  product: "a personal loan from Meridian Finance"
  amount: "up to 5000000 rupees (50 lakh)"
  tenure: "from 6 months to 120 months (10 years)"
  steps: "identity check (name, date of birth, PAN), a passcode sent to the registered mobile, the loan amount, tenure, monthly income and job, an instant decision, then consent"
  interest_rate: "depends on the eligibility check; it is known only after the check"
  documents: "no documents are needed on this call"

timing:
  filler_after_ms: 700             # first sentence of the reply not ready this long after the turn: the filler
  reprompt_after_s: 6              # caller silent this long after the agent finished: "are you there?"
  hold_s: 20                       # after "एक सेकंड" (one second): wait this long before "are you there?"
  hangup_after_reprompts: 3
  max_unclear: 3                   # unclear answers in a row to one question before handing over
  max_off_topic: 2

slots:
  full_name: {type: name, describe: "the caller's full name"}
  dob:
    type: date
    min_age: 18
    describe: "the caller's date of birth"
    reask: {year_ambiguous: dob_full_year, invalid: dob_invalid}
  pan: {type: pan, describe: "the caller's PAN", reask: {partial: pan_not_heard}}
  otp: {type: digits, length: 6, describe: "the six-digit passcode sent to the caller", reask: {partial: otp_not_heard}}
  amount:
    type: money
    min: 1000
    max: 5000000
    describe: "the loan amount in rupees"
    reask: {out_of_range: amount_out_of_range, unclear: amount_again}
  tenure_months:
    type: duration
    unit: months
    min: 6
    max: 120
    describe: "the loan tenure"
    reask: {out_of_range: tenure_out_of_range}
  income:
    type: money
    unit: month
    min: 1000
    max: 10000000
    describe: "the caller's monthly income in rupees"
    reask: {out_of_range: income_again, unclear: income_again}
  employment_type:
    type: choice
    describe: "whether the caller is salaried, self-employed or not working"
    options:                       # the first that matches wins, so self-employment comes before "no job"
      self_employed: [बिज़नेस, बिजनेस, अपना काम, खुद का, ख़ुद का, दुकान, व्यापार, फ्रीलांस, फ्रीलांसर, सेल्फ एम्प्लॉयड,
                      धंधा, प्रैक्टिस, कंसल्टेंट, खेती, ठेकेदार]
      unemployed: [बेरोज़गार, बेरोजगार, काम नहीं, नौकरी नहीं, जॉब नहीं, अनएम्प्लॉयड, कुछ नहीं करता, कुछ नहीं करती,
                   स्टूडेंट, पढ़ाई]
      salaried: [नौकरी, सैलरी, सैलरीड, जॉब, तनख्वाह, तनख़्वाह, कंपनी में, सरकारी, प्राइवेट, एम्प्लॉयड, सर्विस, वेतन,
                 ऑफिस, कर्मचारी]
  email: {type: email, describe: "the caller's email address", reask: {partial: email_not_heard}}

intents:
  resend_code:
    describe: "the passcode didn't arrive, or they want a new one"
    phrases: [कोड नहीं आया, कोड नहीं मिला, ओटीपी नहीं आया, ओटीपी नहीं मिला, नहीं आया, नहीं मिला, दोबारा भेजिए,
              फिर से भेजिए, नया कोड, दोबारा भेजो, फिर से भेजो, रीसेंड]
    act_directly: true             # sending another code is harmless; the backend limits how many
  dispute:
    describe: "disagrees with or argues against the loan decision"

lines:
  # --- fixed (synthesised once at startup)
  greeting: "मैं {agent}, {company} से बात कर रहा हूँ। यह कॉल गुणवत्ता के लिए रिकॉर्ड की जा रही है। क्या आपके पास पर्सनल लोन के आवेदन के लिए तीन-चार मिनट हैं?"
  # I am Laghu, speaking from Meridian Finance. This call is being recorded for quality.
  # Do you have three-four minutes for a personal loan application?
  verified: "धन्यवाद, आपकी पहचान की पुष्टि हो गई।"             # Thank you, your identity is verified.
  ask_consent: "क्या आप इन शर्तों से, और हमारी क्रेडिट ब्यूरो जाँच से, सहमत हैं? कृपया हाँ या ना में जवाब दीजिए।"
  # Do you agree to these terms, and to our credit bureau check? Please answer yes or no.
  not_heard_guard: "आगे बढ़ने से पहले, कृपया पूरा सवाल सुन लीजिए।"
  # Before we go ahead, please listen to the whole question.
  consent_yes_done: "धन्यवाद, मैंने आपकी सहमति दर्ज कर ली है। आपका आवेदन जमा हो गया है, और आपको जल्द ही एसएमएस से पुष्टि मिलेगी। आपका दिन शुभ हो।"
  # Thank you, I've recorded your consent. Your application is submitted, and you'll soon get a
  # confirmation by SMS. Have a good day.
  consent_no_done: "कोई बात नहीं। मैंने दर्ज कर लिया है कि आप सहमत नहीं हैं, और मैं आवेदन आगे नहीं बढ़ाऊँगा। धन्यवाद।"
  # No problem. I've recorded that you don't agree, and I won't take the application forward. Thank you.
  declined: "आपकी दी गई जानकारी के आधार पर, मैं आज यह लोन ऑफ़र नहीं कर पा रहा हूँ। क्या आप इस बारे में हमारे किसी सहयोगी से बात करना चाहेंगे?"
  # Based on the details you've given, I'm not able to offer this loan today. Would you like to talk to
  # one of our colleagues about it?
  referred: "आपके आवेदन को हमारे एक सहयोगी को एक बार देखना होगा। क्या मैं आपको अभी उनसे जोड़ दूँ?"
  # One of our colleagues needs to look at your application. Shall I connect you to them now?
  identity_blocked: "माफ़ कीजिए, मैं फ़ोन पर इन जानकारियों की पुष्टि नहीं कर पा रहा हूँ।"
  # Sorry, I'm not able to verify these details over the phone. (Never the reason: it may be a sanctions hit.)
  otp_blocked: "माफ़ कीजिए, मैं इस कोड की पुष्टि नहीं कर पा रहा हूँ।"       # Sorry, I'm not able to verify this code.
  tech_problem: "माफ़ कीजिए, अभी हमारे सिस्टम में कुछ तकनीकी दिक्कत है।"   # Sorry, there's a technical problem right now.
  transfer: "मैं आपको अपने एक सहयोगी से जोड़ रहा हूँ। कृपया लाइन पर बने रहिए।"
  # I'm connecting you to one of my colleagues. Please stay on the line.
  transfer_failed: "माफ़ कीजिए, अभी मैं आपको किसी सहयोगी से नहीं जोड़ पा रहा हूँ। कृपया हमारी नज़दीकी शाखा से संपर्क करें। धन्यवाद।"
  # Sorry, I can't connect you to a colleague right now. Please contact our nearest branch. Thank you.
  lead_emailed: "धन्यवाद, मैंने आपकी जानकारी दर्ज कर ली है। आवेदन पूरा करने का लिंक आपको ईमेल पर भेज दिया गया है। आपका दिन शुभ हो।"
  # Thank you, I've noted your details. A link to finish the application has been emailed to you. Have a good day.
  lead_callback: "धन्यवाद, मैंने आपकी जानकारी दर्ज कर ली है। हमारे एक सहयोगी जल्द ही आपसे संपर्क करेंगे। आपका दिन शुभ हो।"
  # Thank you, I've noted your details. One of our colleagues will contact you soon. Have a good day.
  hangup_silence: "मुझे आपकी आवाज़ नहीं आ रही है। मैं यह कॉल समाप्त कर रहा हूँ। धन्यवाद।"
  # I can't hear you. I'm ending this call. Thank you.
  repeat: "जी, मैं दोबारा बोलता हूँ।"                         # Sure, I'll say it again.
  question_fallback: "इसकी पक्की जानकारी मैं अभी नहीं दे सकता।"     # I can't give definite information about that now.
  hold_ok: "जी, ज़रूर।"                                           # Sure. (said to "one second", then it waits)
  filler: "जी, एक पल।"                                          # Yes, one moment.

  # --- templates (exact wording, the call's values filled in)
  confirm_identity: "मैंने यह लिखा है। नाम, {full_name:hi}। जन्म तिथि, {dob:date}। पैन, {pan:spell}। क्या यह सब सही है?"
  # I have noted this. Name, X. Date of birth, Y. PAN, Z. Is all of this correct?
  otp_sent_phone: "धन्यवाद, आपका रिकॉर्ड मिल गया। आपके रजिस्टर्ड मोबाइल पर, जिसके आख़िरी चार अंक {phone_last4:digits} हैं, एक छह अंकों का कोड भेजा गया है। कृपया वह कोड बताइए।"
  # Thank you, I found your record. A six-digit code has been sent to your registered mobile ending in
  # 1 2 3 4. Please tell me that code.
  otp_sent_email: "धन्यवाद, आपका रिकॉर्ड मिल गया। आपके रजिस्टर्ड ईमेल पर एक छह अंकों का कोड भेजा गया है। कृपया वह कोड बताइए।"
  # Thank you, I found your record. A six-digit code has been sent to your registered email. Please tell me that code.
  approved: "अच्छी ख़बर है। आप {approved_amount:words} रुपये के लोन के लिए पात्र हैं, {tenure_months:tenure} के लिए, {interest_rate:rate} प्रतिशत सालाना ब्याज पर। आपकी महीने की किस्त लगभग {monthly_instalment:words} रुपये होगी।"
  # Good news. You are eligible for a loan of X rupees, for Y, at Z percent annual interest.
  # Your monthly instalment will be about W rupees.
  counter_offer: "आपने जितनी राशि माँगी थी, उतनी अभी संभव नहीं है। लेकिन मैं आपको {approved_amount:words} रुपये का लोन ऑफ़र कर सकता हूँ, {tenure_months:tenure} के लिए, {interest_rate:rate} प्रतिशत सालाना ब्याज पर। आपकी महीने की किस्त लगभग {monthly_instalment:words} रुपये होगी।"
  # The amount you asked for isn't possible right now. But I can offer you a loan of X rupees, for Y,
  # at Z percent annual interest. Your monthly instalment will be about W rupees.
  confirm_email: "मैंने ईमेल लिखा है, {email:spell}। क्या यह सही है?"    # I've written the email as X. Is that correct?

  # --- written by the LLM (example: the style, and the fallback)
  ask_name:
    llm: "Acknowledge briefly, then ask for their full name."
    example: "ठीक है। सबसे पहले, कृपया अपना पूरा नाम बताइए।"            # Okay. First, please tell me your full name.
  ask_name_again:
    llm: "Say you'll take the details once more, and ask for their full name."
    example: "चलिए फिर से शुरू करते हैं। कृपया अपना पूरा नाम बताइए।"       # Let's start again. Please tell me your full name.
  identity_mismatch:
    llm: "Say gently that these details didn't match the records."
    example: "माफ़ कीजिए, ये जानकारी हमारे रिकॉर्ड से मेल नहीं खाई।"       # Sorry, these details didn't match our records.
  ask_dob:
    llm: "Thank them, then ask for their date of birth: day, month and year."
    example: "धन्यवाद। अब अपनी जन्म तिथि बताइए, दिन, महीना और साल।"       # Thank you. Now your date of birth: day, month, year.
  dob_full_year:
    llm: "Ask for the full year of birth, with an example like nineteen ninety."
    example: "कृपया जन्म का पूरा साल बताइए, जैसे उन्नीस सौ नब्बे।"         # Please say the full year, like nineteen ninety.
  dob_invalid:
    llm: "Say that date doesn't seem right, and ask for the date of birth again: day, month and year."
    example: "यह तारीख़ सही नहीं लग रही। कृपया जन्म तिथि फिर से बताइए, दिन, महीना और साल।"
    # That date doesn't seem right. Please tell me your date of birth again: day, month and year.
  ask_pan:
    llm: "Ask for their PAN number, one character at a time."
    example: "अब अपना पैन नंबर, एक-एक अक्षर करके बताइए।"                 # Now your PAN number, one character at a time.
  pan_not_heard:
    llm: "Say you didn't catch the whole PAN, and ask them to say it again slowly, one character at a time."
    example: "मुझे पूरा पैन नंबर साफ़ सुनाई नहीं दिया। कृपया धीरे-धीरे, एक-एक अक्षर करके फिर से बताइए।"
    # I didn't hear the full PAN clearly. Please say it again slowly, one character at a time.
  otp_not_heard:
    llm: "Say you didn't hear all six digits, and ask for the code again, one digit at a time."
    example: "मुझे पूरे छह अंक सुनाई नहीं दिए। कृपया कोड फिर से, एक-एक अंक करके बताइए।"
    # I didn't hear all six digits. Please say the code again, one digit at a time.
  otp_wrong:
    llm: "Say that code isn't correct, and ask them to read it out once more."
    example: "यह कोड सही नहीं है। कृपया एक बार फिर बताइए।"                # This code isn't correct. Please say it once more.
  otp_resent:
    llm: "Say you've sent a new code and the old one won't work any more, and ask for the new code."
    example: "मैंने नया कोड भेज दिया है। पुराना कोड अब काम नहीं करेगा। कृपया नया कोड बताइए।"
    # I've sent a new code. The old code won't work any more. Please tell me the new code.
  otp_expired_resent:
    llm: "Say the code had expired so you've sent a new one, and ask for the new code."
    example: "वह कोड एक्सपायर हो गया था, इसलिए मैंने नया कोड भेजा है। कृपया नया कोड बताइए।"
    # That code had expired, so I've sent a new one. Please tell me the new code.
  ask_amount:
    llm: "Ask how much loan amount they need."
    example: "आपको कितनी राशि का लोन चाहिए?"                               # How much loan amount do you need?
  amount_again:
    llm: "Ask for the loan amount in rupees, with an example like three lakh rupees."
    example: "कृपया लोन की राशि बताइए, जैसे तीन लाख रुपये।"                # Please say the loan amount, like three lakh rupees.
  amount_out_of_range:
    llm: "Say the loan amount can be at most fifty lakh rupees, and ask how much they need."
    example: "लोन की राशि पचास लाख रुपये तक हो सकती है। आपको कितनी राशि चाहिए?"
    # The loan amount can be up to fifty lakh rupees. How much do you need?
  ask_tenure:
    llm: "Ask for how long they want the loan; they can say it in months or years."
    example: "कितने समय के लिए? आप महीनों या सालों में बता सकते हैं।"         # For how long? In months or years.
  tenure_out_of_range:
    llm: "Say the tenure can be from six months to ten years, and ask for how long they'd like it."
    example: "लोन की अवधि छह महीने से दस साल के बीच हो सकती है। आप कितने समय के लिए लेना चाहेंगे?"
    # The tenure can be between six months and ten years. For how long would you like it?
  ask_income:
    llm: "Ask what their monthly income is."
    example: "आपकी महीने की आमदनी कितनी है?"                              # What is your monthly income?
  income_again:
    llm: "Ask for their monthly income in rupees, with an example like fifty thousand rupees."
    example: "कृपया अपनी महीने की आमदनी रुपयों में बताइए, जैसे पचास हज़ार रुपये।"
    # Please tell me your monthly income in rupees, like fifty thousand rupees.
  ask_employment:
    llm: "Ask whether they have a job, run their own work or business, or aren't working at the moment."
    example: "आप नौकरी करते हैं, अपना काम या बिज़नेस करते हैं, या अभी काम नहीं कर रहे हैं?"
    # Do you have a job, run your own work or business, or are you not working at the moment?
  offer_lead:
    llm: "Say no account was found with us for their PAN, and offer to note their details and email them a link to finish the application. Ask if they'd like that."
    example: "आपके पैन पर हमारे साथ कोई खाता नहीं मिला। मैं आपकी जानकारी दर्ज करके, आवेदन पूरा करने का लिंक ईमेल पर भेज सकता हूँ। क्या आप ऐसा चाहेंगे?"
    # No account was found with us for your PAN. I can note your details and email you a link to finish
    # the application. Would you like that?
  ask_email:
    llm: "Ask for their email address."
    example: "कृपया अपना ईमेल पता बताइए।"                                 # Please tell me your email address.
  email_not_heard:
    llm: "Say you didn't catch the email address clearly, and ask them to say it again slowly."
    example: "माफ़ कीजिए, ईमेल पता साफ़ सुनाई नहीं दिया। कृपया धीरे-धीरे फिर से बताइए।"
    # Sorry, I didn't hear the email clearly. Please say it again slowly.
  not_now:
    llm: "Say that's fine, they can call back whenever they like, and thank them."
    example: "कोई बात नहीं। आप जब चाहें हमें दोबारा कॉल कर सकते हैं। धन्यवाद।"
    # No problem. You can call us again whenever you like. Thank you.
  goodbye:
    llm: "Say okay, thank them for their time, and wish them a good day."
    example: "ठीक है। आपके समय के लिए धन्यवाद। आपका दिन शुभ हो।"          # Okay. Thank you for your time. Have a good day.
  low_confidence:
    llm: "Apologise that you're having trouble understanding them."
    example: "माफ़ कीजिए, मुझे आपकी बात ठीक से समझ नहीं आ रही है।"          # Sorry, I'm having trouble understanding you.
  out_of_scope:
    llm: "Say your colleagues can help them better with this."
    example: "इसमें मेरे सहयोगी आपकी बेहतर मदद कर पाएँगे।"                 # My colleagues can help you better with this.
  pick_one:
    llm: "Say they mentioned more than one, and ask them to choose one."
    example: "आपने एक से ज़्यादा बताया। कृपया कोई एक बताइए।"           # You mentioned more than one. Please say just one.
  not_heard:
    llm: "Say you couldn't hear them."
    example: "माफ़ कीजिए, मैं आपकी बात सुन नहीं पाया।"                       # Sorry, I couldn't hear you.
  unclear:
    llm: "If the caller asked or said something you can reply to from FACTS (a question without a question word, like whether there are other plans), reply to it in one sentence; otherwise say briefly that you didn't quite understand."
    example: "माफ़ कीजिए, मैं ठीक से समझ नहीं पाया।"                        # Sorry, I didn't quite understand.
  was_asking:
    llm: "Say that you were asking something (the question follows)."
    example: "जी, मैं पूछ रहा था।"                                        # Yes, I was asking:
  are_you_there:
    llm: "Ask if they are still on the line."
    example: "क्या आप लाइन पर हैं?"                                       # Are you on the line?
  scope:
    llm: "Say that on this call you can only help with the personal loan application."
    example: "मैं इस कॉल पर सिर्फ़ पर्सनल लोन के आवेदन में मदद कर सकता हूँ।"   # On this call I can only help with the loan application.

backend:
  provider: http                   # URL: ONBOARDING_URL (default http://127.0.0.1:8000)
  health: /healthz
  start:
    path: /v1/sessions
    body: {external_call_id: "{call_id}", channel: voice, language: hi-IN}
    save: {session_id: session_id}

tools:
  verify_identity:
    path: /v1/tools/verify_identity
    body: {session_id: "{session_id}", full_name: "{full_name}", date_of_birth: "{dob:iso}", pan: "{pan}"}
    save:
      phone_last4: {from: data.phone_last4, private: true}           # kept out of the LLM's view
      demo_otp: {from: data.demo_otp, private: digits, show: true}   # demo mode only; shown to the tester
    events:
      - {if: {outcome: otp_sent, data.phone_last4: present}, then: otp_sent_phone}
      - {if: {outcome: otp_sent}, then: otp_sent_email}
      - {if: {outcome: retry}, then: retry, clear: [full_name, dob, pan]}
      - {if: {outcome: not_registered}, then: not_registered}
      - {if: {outcome: blocked}, then: blocked}
      - {then: error}
  verify_otp:
    path: /v1/tools/verify_otp
    body: {session_id: "{session_id}", code: "{otp}"}
    events:
      - {if: {outcome: ok}, then: ok}
      - {if: {outcome: retry, data.reason: expired}, then: expired}
      - {if: {outcome: retry}, then: wrong}
      - {if: {outcome: blocked}, then: blocked}
      - {then: error}
  resend_otp:
    path: /v1/tools/resend_otp
    body: {session_id: "{session_id}"}
    save:
      demo_otp: {from: data.demo_otp, private: digits, show: true}
    events:
      - {if: {outcome: otp_sent}, then: sent}
      - {if: {outcome: blocked}, then: blocked}
      - {then: error}
  check_eligibility:
    path: /v1/tools/check_eligibility
    body: {session_id: "{session_id}", product_code: personal_loan, requested_amount: "{amount}",
           tenure_months: "{tenure_months}", declared_monthly_income: "{income}", employment_type: "{employment_type}"}
    save: {decision: data.decision, approved_amount: data.approved_amount, interest_rate: data.interest_rate,
           monthly_instalment: data.monthly_instalment}
    events:
      - {if: {data.decision: approved, data.approved_amount: {lt: "{amount}"}}, then: counter}
      - {if: {data.decision: approved}, then: approved}
      - {if: {data.decision: referred}, then: referred}
      - {if: {data.decision: declined}, then: declined}
      - {then: error}
  record_consent:
    path: /v1/tools/record_consent
    body: {session_id: "{session_id}", consent_type: terms_and_conditions, granted: "{granted}",
           verbatim_response: "{last_caller_text}"}
    events:
      - {if: {status: 200}, then: recorded}
      - {then: error}
  escalate:
    path: /v1/tools/escalate
    body: {session_id: "{session_id}", reason_code: "{reason}",
           summary: "Voice agent hand-over ({reason}) from dialog state {state}."}
    events:
      - {if: {outcome: ok}, then: ok}
      - {then: failed}
  capture_lead:
    path: /v1/tools/capture_lead
    body: {session_id: "{session_id}", full_name: "{full_name}", date_of_birth: "{dob:iso}", pan: "{pan}",
           email: "{email}", product_interest: personal_loan}
    events:
      - {if: {outcome: ok, data.link_emailed: true}, then: emailed}
      - {if: {outcome: ok}, then: callback}
      - {then: error}

states:
  greet: {say: greeting, expect: yes_no, on: {yes: ask_name, no: not_now}}
  not_now: {say: not_now, end: caller_declined, outcome: declined}

  ask_name: {say: ask_name, expect: full_name, on: {answer: ask_dob}}
  ask_name_again: {say: ask_name_again, expect: full_name, on: {answer: ask_dob}}
  ask_dob: {say: ask_dob, expect: dob, on: {answer: ask_pan}}
  ask_pan: {say: ask_pan, expect: pan, on: {answer: confirm_identity}}
  confirm_identity:
    say: confirm_identity
    expect: yes_no
    corrections: [dob, pan]          # a new date of birth or PAN in the reply replaces the old one
    require_heard: true              # a yes over an interrupted read-back doesn't count
    on: {yes: verify_identity, no: ask_name_again}
  verify_identity:
    tool: verify_identity
    on: {otp_sent_phone: ask_otp_phone, otp_sent_email: ask_otp_email, retry: identity_retry,
         not_registered: offer_lead, blocked: identity_blocked, error: tech_problem}
  identity_retry: {say: identity_mismatch, next: ask_name_again}
  identity_blocked: {say: identity_blocked, next: escalate_identity}

  ask_otp_phone: {say: otp_sent_phone, expect: otp, on: {answer: verify_otp, resend_code: resend_otp}}
  ask_otp_email: {say: otp_sent_email, expect: otp, on: {answer: verify_otp, resend_code: resend_otp}}
  verify_otp:
    tool: verify_otp
    on: {ok: verified, wrong: otp_wrong, expired: resend_expired, blocked: otp_blocked, error: tech_problem}
  otp_wrong: {say: otp_wrong, expect: otp, on: {answer: verify_otp, resend_code: resend_otp}}
  resend_otp: {tool: resend_otp, on: {sent: otp_resent, blocked: otp_blocked, error: tech_problem}}
  resend_expired: {tool: resend_otp, on: {sent: otp_expired_resent, blocked: otp_blocked, error: tech_problem}}
  otp_resent: {say: otp_resent, expect: otp, on: {answer: verify_otp, resend_code: resend_otp}}
  otp_expired_resent: {say: otp_expired_resent, expect: otp, on: {answer: verify_otp, resend_code: resend_otp}}
  otp_blocked: {say: otp_blocked, next: escalate_identity}

  verified: {say: verified, next: ask_amount}
  ask_amount: {say: ask_amount, expect: amount, also: [tenure_months], skip_if: amount, on: {answer: ask_tenure}}
  ask_tenure: {say: ask_tenure, expect: tenure_months, skip_if: tenure_months, on: {answer: ask_income}}
  ask_income: {say: ask_income, expect: income, skip_if: income, on: {answer: ask_employment}}
  ask_employment: {say: ask_employment, expect: employment_type, skip_if: employment_type, on: {answer: check_eligibility}}
  check_eligibility:
    tool: check_eligibility
    on: {approved: approved, counter: counter_offer, referred: referred, declined: declined, error: tech_problem}
  approved: {say: approved, next: ask_consent}
  counter_offer: {say: counter_offer, next: ask_consent}
  ask_consent:
    say: ask_consent
    expect: yes_no
    require_heard: true              # the offer and the question are said again if the caller cut them off
    on: {yes: consent_yes, no: consent_no, dispute: escalate_dispute}
  consent_yes: {tool: record_consent, with: {granted: true}, on: {recorded: consent_yes_done, error: tech_problem}}
  consent_no: {tool: record_consent, with: {granted: false}, on: {recorded: consent_no_done, error: tech_problem}}
  consent_yes_done: {say: consent_yes_done, end: completed, outcome: success}
  consent_no_done: {say: consent_no_done, end: consent_declined, outcome: declined}
  declined:
    say: declined
    expect: yes_no
    on: {yes: escalate_dispute, dispute: escalate_dispute, human: escalate_dispute, no: goodbye}
  referred: {say: referred, expect: yes_no, on: {yes: escalate_referred, human: escalate_referred, no: goodbye}}
  goodbye: {say: goodbye, end: caller_declined, outcome: declined}

  offer_lead: {say: offer_lead, expect: yes_no, on: {yes: ask_email, no: goodbye}}
  ask_email: {say: ask_email, expect: email, on: {answer: confirm_email}}
  confirm_email:
    say: confirm_email
    expect: yes_no
    corrections: [email]
    require_heard: true
    on: {yes: capture_lead, no: ask_email}
  capture_lead: {tool: capture_lead, on: {emailed: lead_emailed, callback: lead_callback, error: tech_problem}}
  lead_emailed: {say: lead_emailed, end: lead_captured, outcome: success}
  lead_callback: {say: lead_callback, end: lead_captured, outcome: success}

  # Hand-overs. The reason codes are the backend's.
  escalate_requested: {tool: escalate, with: {reason: customer_requested_human}, on: {ok: transfer, failed: transfer_failed}}
  escalate_identity: {tool: escalate, with: {reason: identity_verification_failed}, on: {ok: transfer, failed: transfer_failed}}
  escalate_dispute: {tool: escalate, with: {reason: customer_disputes_decision}, on: {ok: transfer, failed: transfer_failed}}
  escalate_referred: {tool: escalate, with: {reason: customer_requested_human}, on: {ok: transfer, failed: transfer_failed}}
  escalate_low_confidence: {tool: escalate, with: {reason: low_confidence_transcription}, on: {ok: transfer, failed: transfer_failed}}
  escalate_out_of_scope: {tool: escalate, with: {reason: out_of_scope_request}, on: {ok: transfer, failed: transfer_failed}}
  escalate_technical: {tool: escalate, with: {reason: technical_failure}, on: {ok: transfer, failed: transfer_failed}}
  low_confidence: {say: low_confidence, next: escalate_low_confidence}
  out_of_scope: {say: out_of_scope, next: escalate_out_of_scope}
  tech_problem: {say: tech_problem, next: escalate_technical}
  transfer: {say: transfer, end: transferred, outcome: transferred}
  transfer_failed: {say: transfer_failed, end: transfer_failed, outcome: failed}
  hangup_silence: {say: hangup_silence, end: no_response, outcome: no_contact}

global:                            # where these go from any waiting state, unless the state's own `on` says
  human: escalate_requested
  stop: goodbye
  off_topic_limit: out_of_scope      # the max_off_topic-th off-topic request
  low_confidence: low_confidence     # max_unclear unclear answers in a row
  silence: hangup_silence            # hangup_after_reprompts unanswered "are you there?"
  unavailable: transfer_failed       # the backend can't be reached when the call starts
