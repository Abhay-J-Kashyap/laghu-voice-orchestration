  provider: mock

tools:
  book_session:
    mock:
    - if:
        program: full_time
      outcome: ok
      data:
        session_id: S123
    - if:
        program: executive
      outcome: ok
      data:
        session_id: S124
    - if:
        program: online
      outcome: ok
      data:
        session_id: S125
    - outcome: ok
    save:
      session_id: data.session_id
    events:
    - if:
        outcome: ok
      then: session_booked
    - then: error
    commits: true

states:
  greet:
    expect: yes_no
    say: greeting
    also:
    - name
    'on':
      'yes': ask_program
      'no': decline_greeting
  decline_greeting:
    say: goodbye_decline
    end: declined
    outcome: declined
  ask_program:
    expect: program
    say: ask_program
    'on':
      answer: ask_intake
  ask_intake:
    expect: intake
    say: ask_intake
    'on':
      answer: ask_work_exp
  ask_work_exp:
    expect: work_exp
    say: ask_work_exp
    'on':
      answer: ask_city
  ask_city:
    expect: city
    say: ask_city
    'on':
      answer: offer_session
  offer_session:
    say: offer_session
    expect: yes_no
    'on':
      'yes': ask_session_time
      'no': callback_offer
  callback_offer:
    say: callback_offer
    expect: yes_no
    'on':
      'yes': ask_callback_time
      'no': goodbye_no_booking
  ask_session_time:
    expect: session_time
    say: ask_session_time
    'on':
      answer: confirm_details
  ask_callback_time:
    expect: callback_time
    say: ask_callback_time
    'on':
      answer: confirm_callback
  confirm_details:
    say: readback_details
    expect: yes_no
    corrections:
    - program
    - intake
    - work_exp
    - city
    - session_time
    'on':
      'yes': commit_booking
      'no': fix_details
      corrected: confirm_details
  fix_details:
    say: fix_prompt
    expect: yes_no
    corrections:
    - program
    - intake
    - work_exp
    - city
    - session_time
    'on':
      'yes': confirm_details
      'no': goodbye_no_booking
      corrected: confirm_details
  commit_booking:
    tool: book_session
    'on':
      session_booked: booking_success
      error: tech_problem
  booking_success:
    say: booking_confirmed
    end: booked
    outcome: success
  confirm_callback:
    say: readback_callback
    expect: yes_no
    corrections:
    - callback_time
    'on':
      'yes': callback_success
      'no': goodbye_no_booking
      corrected: confirm_callback
  callback_success:
    say: callback_confirmed
    end: callback_scheduled
    outcome: success
  goodbye_no_booking:
    say: goodbye_no_booking
    end: declined
    outcome: declined
  scholarship_help:
    say: scholarship_line
    next: back
  admission_help:
    say: admission_line
    next: back
  human_help:
    say: human_line
    next: handover

global:
  scholarship: scholarship_help
  admission_guarantee: admission_help
  human: human_help
  callback_request: callback_offer
