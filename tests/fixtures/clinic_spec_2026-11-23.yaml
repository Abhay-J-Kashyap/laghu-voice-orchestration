  ask_age: "कृपया रोगी की आयु बताइए।"
  # Please tell the patient's age.
  ask_time: "कौन सा दिन और सुबह या शाम आप आना चाहेंगे? (अगले सात दिनों में)"
  # Which day and morning/evening would you like to come? (within next 7 days)
  read_back: "मैं समझा कि {name:hi} की आयु {age:words} साल है, डॉक्टर {doctor:label} के साथ, {appointment_time:time} पर। क्या यह सही है?"
  # I have understood that {name} is {age} years old, with Dr. {doctor} at {appointment_time}. Is this correct?
  fix_prompt:
    llm: "Ask which detail the caller wants to change or if they prefer not to book now."
    example: "कौन सी जानकारी बदलनी है या आप अभी बुक नहीं करना चाहते?"
  # Ask which detail the caller wants to change or if they prefer not to book now.
  booked: "आपकी अपॉइंटमेंट {appointment_time:time} को डॉक्टर {doctor:label} के साथ बुक हो गई है। धन्यवाद।"
