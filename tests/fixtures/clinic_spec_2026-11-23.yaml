backend:
  provider: mock

tools:
  book_appointment:
    mock:
    - outcome: ok
      data:
        confirmation: Appointment booked
    events:
    - if:
        outcome: ok
      then: ok
    - then: error
    commits: true

states:
  greet:
    expect: yes_no
    say: greeting
    also:
    - name
    'on':
      'yes': ask_problem
      'no': goodbye_decline
  goodbye_decline:
    end: declined
    outcome: declined
    say: goodbye_decline
  ask_problem:
    expect: problem
    say: ask_problem
    'on':
      answer: decide_doctor
  decide_doctor:
    say: decide_doctor
    next: ask_age
  ask_age:
    expect: age
    say: ask_age
    'on':
      answer: ask_time
  ask_time:
    expect: appointment_time
    say: ask_time
    'on':
      answer: confirm
  confirm:
    say: read_back
    expect: yes_no
    corrections:
    - name
    - age
    - doctor
    - appointment_time
    'on':
      'yes': book
      'no': fix
      corrected: confirm
  fix:
    say: fix_prompt
    expect: yes_no
    corrections:
    - name
    - age
    - doctor
    - appointment_time
    'on':
      corrected: confirm
      'yes': confirm
      'no': goodbye_decline
  book:
    tool: book_appointment
    'on':
      ok: booked_success
      error: tech_problem
  booked_success:
    say: booked
    end: booked
    outcome: success
  emergency:
    say: emergency_line
    next: handover
  human:
    say: human_line
    next: handover
  report:
    say: report_line
    next: handover
  cancel:
    say: cancel_not_allowed
    next: handover

global:
  emergency: emergency
  human: human
  report: report
  cancel: cancel
